<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vidéo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay">

    <div id="cta" class="cta">

        <div class="cta__icon">
            <span id="icon"></span>
        </div>

        <div class="cta__content">
            <span id="eyebrow" class="cta__eyebrow"></span>
            <strong id="message" class="cta__message"></strong>
        </div>

        <div class="cta__progress">
            <span id="progress"></span>
        </div>

    </div>

</div>

<script>window.CTA_VARIANT = "record"; window.CTA_CONFIG = { delayBetweenLoops: 8000 };</script>
<script src="cta.js"></script>

</body>
</html>
